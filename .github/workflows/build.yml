name: Build and publish

# Rebuilds the site from Inside Airbnb's latest data every day and publishes
# it to GitHub Pages. Saved Claude reviews (reviews/reviews.json) are reused,
# so no API key is needed here and no review is paid for twice.

on:
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC; picks up each new market snapshot the day it is published
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Stream Inside Airbnb data and rate every listing
        run: python -m airbnb_access web-export --regions all --out _site --reviews reviews/reviews.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
